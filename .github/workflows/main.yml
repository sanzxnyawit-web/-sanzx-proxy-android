name: SANZX PROXY APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project ZIP
        run: test -f SANZX-PROXY-APK-Project.zip

      - name: Extract project
        run: unzip -o SANZX-PROXY-APK-Project.zip -d project

      - name: Locate Gradle project
        run: find project -name gradlew -type f

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          GRADLEW=$(find project -name gradlew -type f | head -n 1)
          test -n "$GRADLEW"
          cd "$(dirname "$GRADLEW")"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SANZX-PROXY-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
