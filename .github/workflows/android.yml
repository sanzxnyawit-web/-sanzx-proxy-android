huname: SANZX PROXY APK Build

on:
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Install Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Check project ZIP
    run: |
      test -f SANZX-PROXY-APK-Project.zip
      unzip -t SANZX-PROXY-APK-Project.zip

  - name: Extract Android project
    run: |
      mkdir -p project
      unzip -o SANZX-PROXY-APK-Project.zip -d project
      echo "Struktur proyek:"
      find project -maxdepth 5 -type f | head -n 100

  - name: Locate Android project
    run: |
      SETTINGS=$(find project -type f -name settings.gradle.kts -print -quit)
      if [ -z "$SETTINGS" ]; then
        echo "ERROR: settings.gradle.kts tidak ditemukan."
        exit 1
      fi
      echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

  - name: Build APK
    run: |
      cd "$PROJECT_DIR"
      gradle wrapper --gradle-version 8.9
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: SANZX-PROXY-APK
      path: '**/build/outputs/apk/debug/*.apk'
      if-no-files-found: error
