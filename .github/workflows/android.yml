name: SANZX PROXY APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          echo "Isi repositori:"
          find . -maxdepth 3 -type f | head -n 100

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          echo "Mencari file gradlew..."
          GRADLEW=$(find . -type f -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: File gradlew tidak ditemukan di repositori."
            exit 1
          fi
          chmod +x "$GRADLEW"
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SANZX-PROXY-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
