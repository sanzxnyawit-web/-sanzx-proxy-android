
name: SANZX PROXY APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Memeriksa file proyek Android..."
          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "Proyek Android belum diunggah."
            exit 1
          fi
          echo "File proyek ditemukan."
          
