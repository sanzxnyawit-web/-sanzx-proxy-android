name: SANZX PROXY APK Build

on:
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Extract Android project
    run: |
      unzip -o SANZX-PROXY-APK-Project.zip -d project
      echo "Isi file hasil ekstrak:"
      find project -maxdepth 4 -type f | head -n 100

  - name: Build APK
    run: |
      GRADLEW=$(find project -type f -name gradlew | head -n 1)
      if [ -z "$GRADLEW" ]; then
        echo "ERROR: gradlew tidak ditemukan di dalam ZIP."
        exit 1
      fi
      chmod +x "$GRADLEW"
      cd "$(dirname "$GRADLEW")"
      ./gradlew assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: SANZX-PROXY-APK
      path: project/**/build/outputs/apk/debug/*.apk
      if-no-files-found: error
